version: '3.8'

services:
  app:
    # 生产环境推荐使用预先构建并推送到镜像仓库的镜像
    # 例如：image: your-registry/nuxtshop:latest
    # 为了本地快速体验，这里仍保留 build 配置
    build: .
    restart: always
    ports:
      - '4000:4000'
    env_file:
      - .env.production
    environment:
      # 强制生产运行模式
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=4000
      # Nitro node-server 运行预设
      - NITRO_PRESET=node-server
      # Redis 在 compose 网络中的主机名与端口
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # 如果 .env.production 中未显式设置 REDIS_DB，则默认 0
      - REDIS_DB=${REDIS_DB:-0}
      # Mongo 连接与 DB 名、管理员账号等从 .env.production 注入：
      # - MONGODB_URI
      # - MONGODB_DB_NAME
      # - ADMIN_USERNAME
      # - ADMIN_PASSWORD
      # - NUXT_PUBLIC_DISABLE_CAPTCHA
    depends_on:
      - redis
    volumes:
      # 挂载上传目录，避免容器重启后丢失用户上传的头像等文件
      - ./public/uploads:/app/public/uploads

  redis:
    image: redis:7-alpine
    restart: always
    command:
      # 如需无密码 Redis，可将这一行改为 ["redis-server"]
      - sh
      - -c
      - |
        if [ -n "$REDIS_PASSWORD" ]; then
          exec redis-server --requirepass "$REDIS_PASSWORD"
        else
          exec redis-server
        fi
    env_file:
      - .env.production
    volumes:
      - redis_data:/data
    # 生产环境不暴露 Redis 端口，只在内部网络访问
    # 如需本地调试，可临时添加：
    # ports:
    #   - "6379:6379"

volumes:
  redis_data:
